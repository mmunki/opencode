name: opencode

# Ask the agent a question by mentioning it in an issue or PR comment.
#
#   /oc what does this repository do?
#   /opencode fix the bug described above
#
# The agent has a token with access to ALL repositories of the owner, so it can
# read and modify any of them, not just this one.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      # The agent creates releases, pushes tags and opens pull requests.
      contents: write
      issues: write
      pull-requests: write
      actions: read
    # A headless runner cannot answer a permission prompt. Without a timeout
    # a stuck job sits for GitHub's 6 hour maximum before it is cancelled.
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The token below is a user token with access to every repository of the
      # owner. `insteadOf` rewrites any github.com remote so that clone/fetch/push
      # works against ANY repository, not only the one running the workflow.
      - name: Configure git for all repositories
        env:
          TOKEN: ${{ secrets.OPENCODE_GITHUB_TOKEN }}
        run: |
          git config --global user.name "opencode-agent[bot]"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      # Only export the provider key when it actually exists. An empty value
      # would make opencode believe the provider is configured and break the
      # free models, so it is deliberately left unset when the secret is absent.
      - name: Export provider API key (if configured)
        env:
          KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "OPENCODE_API_KEY=$KEY" >> "$GITHUB_ENV"
            echo "Provider key detected, using keyed model."
          else
            echo "No provider key configured, using free model."
          fi

      # The scripts that publish a build as a release and that change the
      # account have to be executable before the agent uses them.
      - name: Prepare the release and account tooling
        run: |
          chmod +x .github/scripts/*.sh
          ls -l .github/scripts/

      - name: Remember the state of the checkout
        run: echo "CHECKOUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run opencode
        uses: anomalyco/opencode/github@github-v1.2.26
        env:
          GITHUB_TOKEN: ${{ secrets.OPENCODE_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.OPENCODE_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # The owner token, the agent uses it for everything that is not
          # covered by GITHUB_TOKEN.
          OPENCODE_GITHUB_TOKEN: ${{ secrets.OPENCODE_GITHUB_TOKEN }}
          # Optional: a fine grained token with "Administration: write".
          # Only with it the agent can create new tokens and change the
          # account itself, everything else works without it.
          OPENCODE_ADMIN_TOKEN: ${{ secrets.OPENCODE_ADMIN_TOKEN }}
          # `external_directory` and `doom_loop` default to "ask". In a
          # headless runner nobody can answer that prompt, so the job used to
          # hang until the timeout. Allow everything except an interactive
          # question, which would hang the same way.
          OPENCODE_PERMISSION: '{"*":"allow","question":"deny"}'
        with:
          # Must be a model the opencode provider still serves. The free
          # models rotate, so this ID is checked against
          # `opencode models --provider opencode` when a run fails with
          # "Model not found".
          model: opencode/deepseek-v4.1-flash-free
          use_github_token: true

      # The agent works in its own scratch space, but if it left anything
      # behind in the checkout it is restored here.  The source tree of the
      # repository is never changed by a run, a change is only ever made on a
      # branch and in a pull request.
      - name: Make sure the source tree was not touched
        run: |
          set -euo pipefail
          changed="$(git status --porcelain || true)"
          if [ -n "$changed" ] || [ "$(git rev-parse HEAD)" != "$CHECKOUT_SHA" ]; then
            echo "::warning::the agent changed the checkout, it is restored"
            printf '%s\n' "$changed"
            git fetch --quiet --no-tags origin "$CHECKOUT_SHA" || true
            git reset --hard "$CHECKOUT_SHA" || true
            git clean -fdq
            git checkout --force "$CHECKOUT_SHA" || true
          fi
          echo "the checkout is clean:"
          git status --porcelain
          git rev-parse HEAD
