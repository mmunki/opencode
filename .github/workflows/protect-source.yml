name: protect-source

# The agent must never delete source code.
#
# A pull request that removes a file from the source tree fails this check.
# The only exception is a path that is listed in
# .github/source-protection-allow.txt, for example when the owner moves a
# binary out of the tree into a release.
#
# The rule exists because the agent works unattended: it may decide that a
# file looks obsolete, but only the owner decides what leaves the source
# tree.

on:
  pull_request:
    paths:
      - '**'

jobs:
  no-deletions:
    name: no source file may be deleted
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check that no source file was deleted
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          git fetch --quiet --no-tags origin "$BASE_SHA" || \
            git fetch --quiet --no-tags origin "+refs/heads/*:refs/remotes/origin/*"

          deleted="$(git diff --name-only --diff-filter=D "$BASE_SHA" HEAD || true)"
          if [ -z "$deleted" ]; then
            echo "No source file was deleted."
            exit 0
          fi

          allowed=".github/source-protection-allow.txt"
          bad=""
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if [ -f "$allowed" ] && grep -qxF "$file" "$allowed"; then
              echo "allowed: $file"
              continue
            fi
            bad="$bad$file"$'\n'
          done <<< "$deleted"

          if [ -n "$bad" ]; then
            echo "::error::these files were deleted from the source tree:"
            printf '%s' "$bad"
            echo "The agent does not delete source code.  Put the path into"
            echo "$allowed if the owner really wants the file to go."
            exit 1
          fi

          echo "Every deleted file is on the allow list."
