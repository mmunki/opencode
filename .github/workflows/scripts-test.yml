name: scripts-test

# The agent runner is shell code without a compiler. These checks catch the
# kind of regression that only shows up when a job is already running (a broken
# prompt, a retry loop that never ends, a timeout that leaves a process alive).

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/**'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Lint the shell scripts
        # Going through the manifest means a broken package.json is caught by
        # the same job that validates the scripts it describes.
        run: npm run lint

      - name: Test the fallback runner
        # This is the command the agent runner's post-run gate uses. It has to
        # exist and pass here, otherwise `npm test` fails with ENOENT.
        run: npm test
