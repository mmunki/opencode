name: opencode-triage

# Automatically answers every new (or edited) issue.
# Also available as a manual trigger from the Actions tab.

on:
  issues:
    # Only "opened" - including "edited" makes GitHub emit a second event right
    # after creation, which answers every new issue twice.
    types: [opened]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt to send to opencode"
        required: false
        type: string

permissions: write-all

jobs:
  opencode:
    runs-on: ubuntu-latest

    # A headless runner cannot answer a permission prompt. Without a timeout
    # a stuck job sits for GitHub's 6 hour maximum before it is cancelled.
    timeout-minutes: 180

    env:
      # Give the agent an explicit 8 GiB heap budget. ubuntu-latest itself has
      # 16 GiB, so this leaves memory for the checkout, git and child tools.
      NODE_OPTIONS: "--max-old-space-size=8192"

    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.PAT_TOKEN || secrets.OPENCODE_GITHUB_TOKEN }}

      - name: Show memory budget
        run: |
          echo "Agent heap limit: 8 GiB (NODE_OPTIONS=--max-old-space-size=8192)"
          free -h || true

      - name: Configure git for all repositories
        env:
          TOKEN: ${{ secrets.PAT_TOKEN || secrets.OPENCODE_GITHUB_TOKEN }}
        run: |
          git config --global user.name "opencode-agent[bot]"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Export provider API key (if configured)
        env:
          KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "OPENCODE_API_KEY=$KEY" >> "$GITHUB_ENV"
          fi

      # Load prompt instructions if available in repository
      - name: Load triage prompt
        run: |
          if [ -f "prompts/triage.md" ]; then
            {
              echo "TRIAGE_PROMPT<<EOF"
              cat prompts/triage.md
              echo
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      # Prepare executable tooling scripts if present
      - name: Prepare scripts
        run: |
          if [ -d ".github/scripts" ]; then
            chmod +x .github/scripts/*.sh || true
            ls -l .github/scripts/ || true
          fi

      - name: Remember state of checkout
        run: echo "CHECKOUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # Install OpenCode binary via direct installer script
      - name: Install OpenCode binary
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --version 2.0.22
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      # Configure permissions and settings for OpenCode CLI
      - name: Configure OpenCode
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/opencode"
          cat > "$HOME/.config/opencode/opencode.jsonc" <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": "allow",
            "model": "opencode/deepseek-v4.1-flash-free"
          }
          JSON

      # Run OpenCode directly with live terminal output while maintaining fallback features
      - name: Run OpenCode with fallback & live logging
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.OPENCODE_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.OPENCODE_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          PROMPT: ${{ github.event.inputs.prompt || env.TRIAGE_PROMPT }}
          OPENCODE_GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.OPENCODE_GITHUB_TOKEN }}
          OPENCODE_ADMIN_TOKEN: ${{ secrets.OPENCODE_ADMIN_TOKEN }}
          OPENCODE_PERMISSION: '{"*":"allow"}'
          OPENCODE_STALL_TIMEOUT: "120"
          OPENCODE_ATTEMPT_TIMEOUT: "1200"
        run: .github/scripts/run-opencode-fallback.sh

      # Ensure checkout remains clean
      - name: Make sure source tree was not touched
        run: |
          set -euo pipefail
          changed="$(git status --porcelain || true)"
          if [ -n "$changed" ] || [ "$(git rev-parse HEAD)" != "$CHECKOUT_SHA" ]; then
            echo "::warning::the agent changed the checkout, it is restored"
            printf '%s\n' "$changed"
            git fetch --quiet --no-tags origin "$CHECKOUT_SHA" || true
            git reset --hard "$CHECKOUT_SHA" || true
            git clean -fdq
            git checkout --force "$CHECKOUT_SHA" || true
          fi
          echo "the checkout is clean:"
          git status --porcelain
          git rev-parse HEAD
          
